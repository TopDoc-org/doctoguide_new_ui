<div class="min-h-[100dvh] bg-bg">
  <!-- App chrome. Glass level 2 and `sticky`, not a flex sibling of a
       scrolling <main>: the page itself is the scroller, so content passes
       UNDER the bar (which is the only thing that makes glass mean anything)
       and the console has one scroll region instead of two nested ones.

       `short:` (max-height 520px) is spent here for the same reason it is on
       /triage: this bar is STICKY, so at 844x390 its ~110px is permanently
       gone from a 390px viewport — a quarter of the screen showing a logo and
       a tab strip. Tightened, it costs ~75px. The identity text is not hidden;
       on the admin and creator shells it is the signed-in account, which is
       the one thing you want visible in a console. -->
  <header class="sticky top-0 z-nav glass-2 pt-safe-t">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-2 px-4 pt-3 short:pt-1.5">
      <div class="flex min-w-0 items-center gap-3">
        <div class="grid h-10 w-10 short:h-8 short:w-8 shrink-0 place-items-center rounded-xl bg-grass-600 font-grotesk text-lg font-bold text-white shadow-e1">
          {{ (auth.clinicName || 'P').charAt(0) | uppercase }}
        </div>
        <div class="min-w-0">
          <p class="truncate font-grotesk text-base font-bold tracking-tight text-content-strong">{{ auth.clinicName || 'Partner Portal' }}</p>
          <p class="truncate text-xs text-muted">Campaign dashboard</p>
        </div>
      </div>

      <div class="flex shrink-0 items-center gap-0.5">
        <ds-theme-toggle variant="glass" />
        <button (click)="logout()" aria-label="Log out"
          class="flex min-h-[44px] min-w-[44px] items-center justify-center gap-1.5 rounded-lg px-2.5 text-sm font-medium text-muted transition-colors duration-fast hover:bg-surface-2/70 hover:text-content focus-visible:focus-ring sm:px-3">
          <ds-icon name="logout" [size]="18" />
          <span class="hidden sm:inline">Log out</span>
        </button>
      </div>
    </div>

    <!-- Section nav. `ds-tabs` in its ROUTED mode: real <a routerLink> tabs
         with one tab stop, arrow-key traversal, and the active tab scrolled
         into view — which the hand-rolled `overflow-x-auto` pill row it
         replaces never did, so deep-linking to the last section on a phone
         showed an apparently empty strip. -->
    <div class="mx-auto max-w-5xl px-4 pb-2.5 pt-3 short:pb-1.5 short:pt-1.5">
      <ds-tabs [tabs]="sections" [active]="activeSection()" tone="console" ariaLabel="Partner sections" />
    </div>
  </header>

  <main id="main" class="mx-auto max-w-5xl px-4 pt-6 pb-[calc(1.5rem+var(--safe-bottom))] short:pt-3">
    <div class="motion-safe:animate-fade-up">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
