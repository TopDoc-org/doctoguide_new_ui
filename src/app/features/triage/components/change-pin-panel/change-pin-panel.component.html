<div class="flex min-h-[100dvh] flex-col bg-bg">
  <!-- header -->
  <header class="sticky top-0 z-10 flex items-center gap-2 border-b border-line/5 bg-surface px-3 py-3 sm:px-4">
    <button (click)="goBack()" aria-label="Back"
      class="flex shrink-0 items-center rounded-lg p-1.5 text-brand-ink hover:bg-brand-tint hover:text-ink coarse:min-h-[44px]">
      <ds-icon name="arrow_back" [size]="22" />
    </button>
    <h1 class="font-heading text-lg font-bold text-ink">Change PIN</h1>
  </header>

  <main id="main" class="flex-1 overflow-y-auto px-4 py-6">
    <div class="mx-auto max-w-sm rounded-2xl bg-surface p-6 shadow-sm ring-1 ring-line/10">
      <!-- success -->
      @if (done) {
        <div class="py-4 text-center">
          <div class="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-success-tint text-success-ink">
            <ds-icon name="check_circle" [size]="28" />
          </div>
          <p class="text-sm font-semibold text-ink">PIN updated!</p>
        </div>
      }

      <!-- stage 1: verify current PIN -->
      @if (!done && stage === 'verify') {
        <p class="text-center text-sm text-muted">
          Enter your current PIN to confirm it's you.
        </p>
        <div class="mt-5">
          <app-pin-input
            [length]="4"
            [hasError]="!!verifyError"
            [reset]="oldPinReset"
            (pinComplete)="onOldPinComplete($event)"
          ></app-pin-input>
        </div>
        @if (verifyError) {
          <p class="mt-3 text-center text-xs text-danger-ink">{{ verifyError }}</p>
        }
        @if (verifying) {
          <p class="mt-3 text-center text-xs text-muted">Verifying…</p>
        }
      }

      <!-- stage 2: WhatsApp-OTP reset -->
      @if (!done && stage === 'reset') {
        <div>
          <app-pin-reset
            [prefillMobile]="state.userMobile || ''"
            (resetSuccess)="onDone($event)"
            (back)="goBack()"
          ></app-pin-reset>
        </div>
      }
    </div>
  </main>
</div>
