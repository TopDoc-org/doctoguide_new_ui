<div class="flex min-h-[100dvh] flex-col bg-sand-50">
  <header class="border-b border-sand-200 bg-white px-4 py-3">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-2">
      <div class="flex min-w-0 items-center gap-3">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-grass-600 text-white shadow-sm">
          <ds-icon name="insights" />
        </span>
        <div class="min-w-0">
          <p class="truncate font-grotesk text-base font-bold tracking-tight text-stone-900">Admin Console</p>
          <p class="truncate text-xs text-stone-500">{{ auth.name || 'All clinics' }}</p>
        </div>
      </div>
      <button (click)="logout()" aria-label="Log out"
        class="flex min-h-[44px] items-center gap-1 rounded-xl px-3 py-1.5 text-sm font-medium text-stone-600 transition-colors hover:bg-sand-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-grass-500">
        <ds-icon name="logout" [size]="18" />
        <span class="hidden sm:inline">Log out</span>
      </button>
    </div>

    <nav aria-label="Admin sections" class="mx-auto mt-3 flex max-w-6xl gap-1.5 overflow-x-auto whitespace-nowrap">
      <a routerLink="/admin/overview" routerLinkActive="bg-grass-600 !text-white shadow-sm"
        class="flex min-h-[40px] items-center gap-1.5 rounded-full px-4 text-sm font-semibold text-stone-600 transition-colors hover:bg-sand-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-grass-500">
        <ds-icon name="space_dashboard" [size]="17" />Overview
      </a>
      <a routerLink="/admin/leads" routerLinkActive="bg-grass-600 !text-white shadow-sm"
        class="flex min-h-[40px] items-center gap-1.5 rounded-full px-4 text-sm font-semibold text-stone-600 transition-colors hover:bg-sand-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-grass-500">
        <ds-icon name="group" [size]="17" />Leads
      </a>
    </nav>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-6" style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom));">
    <div class="mx-auto max-w-6xl motion-safe:animate-fade-up">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
