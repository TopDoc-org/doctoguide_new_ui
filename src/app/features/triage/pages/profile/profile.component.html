<div class="flex min-h-[100dvh] flex-col bg-cream">
  <!-- header -->
  <header class="sticky top-0 z-10 flex items-center gap-2 border-b border-black/5 bg-white px-3 py-3 sm:px-4">
    <button (click)="goBack()" aria-label="Back"
      class="flex shrink-0 items-center rounded-lg p-1.5 text-teal-700 hover:bg-teal-50 hover:text-teal-900">
      <ds-icon name="arrow_back" [size]="22" />
    </button>
    <h1 class="flex-1 truncate font-heading text-lg font-bold text-teal-900">My profile</h1>
    <span *ngIf="saved" class="flex shrink-0 items-center gap-1 text-sm font-medium text-green-600">
      <ds-icon name="check_circle" [size]="18" /> Saved
    </span>
    <ds-button type="button" (pressed)="save()" [disabled]="saving || loading" [loading]="saving" size="sm">
      <ds-icon name="check_circle" [size]="18" />{{ saving ? 'Saving…' : 'Save changes' }}
    </ds-button>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-5">
    <div class="mx-auto max-w-2xl">
      <p *ngIf="loading" class="py-10 text-center text-sm text-teal-900/50">Loading your details…</p>

      <p *ngIf="!loading && error && !saving"
        class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-center text-sm text-red-600">
        {{ error }}
      </p>

      <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()" class="space-y-6">
        <!-- Personal details -->
        <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-black/5">
          <h2 class="mb-4 font-heading text-base font-semibold text-teal-900">Personal details</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">First name</label>
              <ds-input formControlName="first_name" placeholder="First name" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Last name</label>
              <ds-input formControlName="last_name" placeholder="Last name" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Date of birth</label>
              <ds-date-field formControlName="DOB" [max]="today" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Gender</label>
              <ds-select formControlName="gender" [options]="genders" placeholder="Select" />
            </div>
          </div>
        </section>

        <!-- Contact -->
        <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-black/5">
          <h2 class="mb-4 font-heading text-base font-semibold text-teal-900">Contact</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Email</label>
              <ds-input type="email" formControlName="email" placeholder="you@example.com" />
              <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-red-600">
                Enter a valid email.
              </small>
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Mobile number</label>
              <ds-input formControlName="mobile" />
              <small class="text-teal-900/40">Your account ID — can't be changed.</small>
            </div>
          </div>
        </section>

        <!-- Address -->
        <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-black/5">
          <h2 class="mb-4 font-heading text-base font-semibold text-teal-900">Address</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-1 sm:col-span-2">
              <label class="text-xs font-medium text-teal-900/60">Address</label>
              <ds-input formControlName="address" placeholder="House / street" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">City</label>
              <ds-input formControlName="city" placeholder="City" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">State</label>
              <ds-input formControlName="state" placeholder="State" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Country</label>
              <ds-input formControlName="country" placeholder="Country" />
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Zipcode</label>
              <ds-input formControlName="Zipcode" placeholder="Zipcode" inputmode="numeric" />
            </div>
          </div>
        </section>

        <!-- Medical -->
        <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-black/5" formGroupName="medical_records">
          <h2 class="mb-4 font-heading text-base font-semibold text-teal-900">Medical</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-teal-900/60">Blood group</label>
              <ds-select formControlName="blood_group" [options]="bloodGroups" placeholder="Select" />
            </div>
          </div>
        </section>

      </form>
    </div>
  </main>
</div>
