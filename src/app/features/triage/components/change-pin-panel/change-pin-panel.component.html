<div class="flex min-h-[100dvh] flex-col bg-cream">
  <!-- header -->
  <header class="sticky top-0 z-10 flex items-center gap-2 border-b border-black/5 bg-white px-3 py-3 sm:px-4">
    <button (click)="goBack()" aria-label="Back"
      class="flex shrink-0 items-center rounded-lg p-1.5 text-teal-700 hover:bg-teal-50 hover:text-teal-900">
      <ds-icon name="arrow_back" [size]="22" />
    </button>
    <h1 class="font-heading text-lg font-bold text-teal-900">Change PIN</h1>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-6">
    <div class="mx-auto max-w-sm rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <!-- success -->
      <div *ngIf="done" class="py-4 text-center">
        <div class="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-green-50 text-green-600">
          <ds-icon name="check_circle" [size]="28" />
        </div>
        <p class="text-sm font-semibold text-teal-900">PIN updated!</p>
      </div>

      <!-- stage 1: verify current PIN -->
      <ng-container *ngIf="!done && stage === 'verify'">
        <p class="text-center text-sm text-teal-900/60">
          Enter your current PIN to confirm it's you.
        </p>
        <div class="mt-5">
          <app-pin-input
            [length]="4"
            [hasError]="!!verifyError"
            [reset]="oldPinReset"
            (pinComplete)="onOldPinComplete($event)"
          ></app-pin-input>
        </div>
        <p *ngIf="verifyError" class="mt-3 text-center text-xs text-red-600">{{ verifyError }}</p>
        <p *ngIf="verifying" class="mt-3 text-center text-xs text-teal-900/50">Verifying…</p>
      </ng-container>

      <!-- stage 2: WhatsApp-OTP reset -->
      <div *ngIf="!done && stage === 'reset'">
        <app-pin-reset
          [prefillMobile]="state.userMobile || ''"
          (resetSuccess)="onDone($event)"
          (back)="goBack()"
        ></app-pin-reset>
      </div>
    </div>
  </main>
</div>
